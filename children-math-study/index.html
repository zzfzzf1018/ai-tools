<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数学奇妙岛 · Math Wonder Island</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body data-theme="candy">
  <div id="app">
    <!-- 顶栏 -->
    <header id="topbar" class="hidden">
      <button id="btn-back" class="btn-round" title="返回">⬅️</button>
      <div id="topbar-title" class="topbar-title">数学奇妙岛</div>
      <div class="topbar-right">
        <div id="star-chip" class="chip">⭐ <span id="star-count">0</span></div>
        <button id="btn-wrong" class="btn-round" title="错题本">📕</button>
        <button id="btn-parent" class="btn-round" title="家长视图">👨‍👩‍👧</button>
      </div>
    </header>
    <!-- 页面容器 -->
    <main id="page"></main>
  </div>

  <!-- 全局弹层：提示阶梯 / 奖励 / 庆祝 -->
  <div id="overlay" class="overlay hidden"></div>

  <script src="content/grade1.js"></script>
  <script src="content/grade2.js"></script>
  <script src="content/grade3.js"></script>
  <script src="content/grade4.js"></script>
  <script src="content/grade5.js"></script>
  <script src="js/save.js"></script>
  <script src="js/data.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/game.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/parent.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
