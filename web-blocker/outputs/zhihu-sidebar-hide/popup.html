<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>知乎侧边栏隐藏</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2329;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #1677ff;
      --chip: #f3f4f6;
      --warn: #d93025;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1f24;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --line: #33383f;
        --accent: #4c9aff;
        --chip: #262a30;
        --warn: #f28b82;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 348px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .row label { flex: 1; }
    .hint { color: var(--muted); font-size: 11px; }
    .switch { position: relative; width: 38px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--line);
      border-radius: 20px;
      transition: background 0.15s;
    }
    .slider::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg);
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    textarea {
      width: 100%;
      min-height: 52px;
      margin-top: 6px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font: 11px/1.5 Consolas, Menlo, monospace;
      resize: vertical;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      margin-top: 8px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--chip);
      color: var(--fg);
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { color: #fff; opacity: 0.9; }
    #status { margin-top: 10px; color: var(--muted); font-size: 11px; min-height: 16px; white-space: pre-wrap; }
    #status.err { color: var(--warn); }
    .item {
      margin-top: 6px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--chip);
      font: 11px/1.5 Consolas, Menlo, monospace;
      word-break: break-all;
      cursor: pointer;
    }
    .item .meta { color: var(--muted); cursor: default; }
  </style>
</head>
<body>
  <h1>知乎侧边栏隐藏</h1>
  <div class="sub" id="ver">—</div>

  <div class="row">
    <label for="enabled">启用隐藏</label>
    <span class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></span>
  </div>

  <div class="row">
    <label for="reflow">
      主内容自动补位
      <div class="hint">收回为侧栏预留的左侧留白</div>
    </label>
    <span class="switch"><input type="checkbox" id="reflow" /><span class="slider"></span></span>
  </div>

  <div class="btns">
    <button id="pick" class="primary">① 点选侧栏</button>
    <button id="diagnose">② 自动识别</button>
    <button id="save">③ 保存并应用</button>
    <button id="clear">清空自定义</button>
  </div>

  <div style="padding-top:8px">
    <div class="hint">已锁定的选择器（一行一个，优先级高于自动识别）</div>
    <textarea id="extra" placeholder="点「① 点选侧栏」后，到页面上单击那个左侧栏即可自动写入"></textarea>
  </div>

  <div id="status"></div>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
