name: Web Blocker CI and Release

on:
  push:
    branches: [main]
    paths:
      - "web-blocker/**"
    tags:
      - "web-blocker-v*"
  pull_request:
    branches: [main]
    paths:
      - "web-blocker/**"

permissions:
  contents: read

concurrency:
  group: web-blocker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: web-blocker
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool restore
      - name: Calculate GitVersion and write it into the manifest
        id: version
        if: startsWith(github.ref, 'refs/tags/web-blocker-v')
        run: python scripts/versioning.py apply --tag "${{ github.ref_name }}"
      - name: Syntax check, integration test and package
        run: python outputs/web-blocker/tools/package.py
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/web-blocker-v')
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/versioning.py prepare --archive dist/web-blocker-v${env:RELEASE_VERSION}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/web-blocker-v')
        with:
          name: web-blocker-${{ steps.version.outputs.version }}
          path: web-blocker/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web-blocker-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-blocker-${{ needs.verify.outputs.version }}
          path: downloads
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd downloads
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published downloads.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./* \
            --target "$RELEASE_SHA" --draft --title "Web Blocker ${RELEASE_TAG#web-blocker-v}" \
            --notes $'网页屏蔽器 Edge/Chrome 扩展\n\n安装方式：\n1. 下载 zip 并解压\n2. 浏览器访问 edge://extensions 或 chrome://extensions\n3. 开启"开发人员模式"\n4. 点击"加载解压缩的扩展"选择解压后的 web-blocker 文件夹\n\n功能：点选网页任意区域并记住规则，自动屏蔽；支持整站或单页生效、快捷键暂停、导入导出。\n\nSHA256SUMS.txt 记录了各下载文件的校验哈希。'
          gh release edit "$RELEASE_TAG" --draft=false --latest
