name: Webpage Magnifier Release

on:
  push:
    branches: [main]
    paths:
      - "webpage-magnifier/**/*.js"
      - "webpage-magnifier/**/*.json"
      - "webpage-magnifier/**/*.css"
      - "webpage-magnifier/**/*.html"
      - "webpage-magnifier/**/*.md"
      - "webpage-magnifier/**/*.png"
    tags:
      - "webpage-magnifier-v*"

permissions:
  contents: read

concurrency:
  group: webpage-magnifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag or manifest
        id: extract-version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/webpage-magnifier-v(.+)$") {
            $version = $Matches[1]
            Write-Host "Using version from tag: $version"
          } else {
            $manifest = Get-Content webpage-magnifier/manifest.json -Raw | ConvertFrom-Json
            $version = $manifest.version
            Write-Host "Using version from manifest: $version"
          }
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build release zip
        shell: pwsh
        run: |
          $version = "${{ steps.extract-version.outputs.version }}"
          $zipName = "webpage-magnifier-$version.zip"
          $zipPath = Join-Path (Get-Location) $zipName
          $stageDir = Join-Path (Get-Location) "stage-wpm"

          # Staging dir — copy files with full relative structure preserved
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$stageDir\icons" | Out-Null

          Copy-Item "webpage-magnifier/manifest.json" "$stageDir\"
          Copy-Item "webpage-magnifier/content.js" "$stageDir\"
          Copy-Item "webpage-magnifier/content.css" "$stageDir\"
          Copy-Item "webpage-magnifier/popup.html" "$stageDir\"
          Copy-Item "webpage-magnifier/popup.js" "$stageDir\"
          Copy-Item "webpage-magnifier/popup.css" "$stageDir\"
          Copy-Item "webpage-magnifier/background.js" "$stageDir\"
          Copy-Item "webpage-magnifier/icons/icon16.png" "$stageDir\icons\"
          Copy-Item "webpage-magnifier/icons/icon48.png" "$stageDir\icons\"
          Copy-Item "webpage-magnifier/icons/icon128.png" "$stageDir\icons\"

          Write-Host "Staging dir contents:"
          Get-ChildItem -Recurse $stageDir | ForEach-Object { $_.FullName.Replace((Get-Location).Path + "\", "") }

          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -Force

          # Verify zip internal structure has icons/ subdir
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          Write-Host "--- ZIP internal structure ---"
          $zip.Entries | ForEach-Object { Write-Host "  $($_.FullName)" }
          $zip.Dispose()

          Write-Host "---"
          Get-Item $zipPath | Select-Object Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webpage-magnifier-${{ steps.extract-version.outputs.version }}
          path: webpage-magnifier-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/webpage-magnifier-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: webpage-magnifier-${{ needs.build.outputs.version }}
          path: downloads

      - name: Extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          CHANGELOG="webpage-magnifier/CHANGELOG.md"
          BODY_FILE="release-body.md"

          if [ -f "$CHANGELOG" ]; then
            if python3 webpage-magnifier/scripts/changelog-section.py "$VERSION" "$CHANGELOG" > "$BODY_FILE"; then
              SECTION=$(cat "$BODY_FILE")
              if [ "$SECTION" != "NOT_FOUND" ] && [ -n "$SECTION" ]; then
                echo "CHANGELOG section extracted:"
                cat "$BODY_FILE"
                echo "has_body=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "CHANGELOG 中未找到 v${VERSION} 段落，退回 --generate-notes"
          else
            echo "CHANGELOG.md 不存在，退回 --generate-notes"
          fi
          echo "NOT_FOUND" > "$BODY_FILE"
          echo "has_body=false" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloads:"
          ls -la downloads/

          VERSION="${RELEASE_TAG#webpage-magnifier-v}"
          ARGS=( "$RELEASE_TAG" "downloads/webpage-magnifier-${VERSION}.zip" )
          ARGS+=( "--target" "$RELEASE_SHA" )
          ARGS+=( "--title" "webpage-magnifier v${VERSION}" )

          if [ "${{ steps.changelog.outputs.has_body }}" = "true" ]; then
            echo "=== Using CHANGELOG body from release-body.md ==="
            echo "--- File contents ---"
            cat release-body.md
            echo "--- End of file ---"
            ARGS+=( "--body-file" "release-body.md" )
          else
            echo "=== Falling back to --generate-notes ==="
            ARGS+=( "--generate-notes" )
          fi

          echo "=== gh release create args ==="
          printf '  %s\n' "${ARGS[@]}"

          if ! gh release create "${ARGS[@]}" 2>&1 | tee gh-output.txt; then
            echo "gh release create FAILED with exit code ${PIPESTATUS[0]}" >&2
            echo "=== gh output ===" >&2
            cat gh-output.txt >&2
            echo "=== release-body.md if exists ===" >&2
            ls -la release-body.md 2>&1 || true
            exit 1
          fi

          echo "Release published: $RELEASE_TAG"
