name: 心晴岛 (Sunny Isles) CI and Release

on:
  push:
    branches: [main]
    paths:
      - "children-social-emotional-learning/**"
      - ".github/workflows/children-social-emotional-learning-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "children-social-emotional-learning/**"
      - ".github/workflows/children-social-emotional-learning-release.yml"

permissions:
  contents: read

concurrency:
  group: sunny-isles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    defaults:
      run:
        working-directory: children-social-emotional-learning
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: children-social-emotional-learning/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool restore
      # 用 npm install 而非 npm ci：electron-builder 含平台专属可选依赖（如 macOS 的 dmg-license），
      # 单一平台生成的 package-lock.json 无法满足 npm ci 的跨平台严格校验；npm install 按当前平台对账即可。
      - run: npm install --no-audit --no-fund
      # npm install 会按 runner 平台重写 package-lock.json（补回平台专属可选依赖，
      # 例如 macOS 的 dmg-license），使工作树变脏；而发布流水线要求干净工作树，
      # 这里还原 lock 文件（node_modules 已安装且被 gitignore，build 不受影响）。
      - run: git checkout -- package-lock.json
      - run: git status --porcelain
      - name: Plan release
        id: plan
        env:
          SEL_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release.cjs plan
      - name: Calculate GitVersion
        id: version
        run: node scripts/release.cjs version
      - name: Validate data and runtime
        run: |
          node tools/verify.mjs
          node tools/smoke.mjs
      - name: Build Windows desktop package
        run: npm run build:win
      # 只有 package.json 版本号相对上一次提交递增（plan=publish）时，才需要整理发布资产。
      # 普通提交/PR 只做构建与校验；否则 GitVersion 的下一版本号会与本次构建的
      # package.json 版本不一致，导致 prepare 步骤必然失败。
      - name: Prepare release assets
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release.cjs prepare
      - name: Generate release notes
        if: steps.plan.outputs.publish == 'true'
        run: node scripts/release-notes.cjs "${{ steps.version.outputs.version }}" release-assets/release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.plan.outputs.publish == 'true'
        with:
          name: sunny-isles-${{ steps.version.outputs.version }}
          path: children-social-emotional-learning/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sunny-isles-${{ needs.verify.outputs.version }}
          path: downloads
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd downloads
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published downloads.' >&2
            exit 1
          fi
          if [ ! -f release-notes.md ]; then
            echo 'release-notes.md missing; using fallback.' >&2
            printf '面向 6–10 岁儿童的社会情绪学习（SEL）游戏软件「心晴岛」。\n\n详见仓库 CHANGELOG.md 与 README.md。' > release-notes.md
          fi
          gh release create "$RELEASE_TAG" ./* \
            --target "$RELEASE_SHA" --draft --title "心晴岛 ${RELEASE_VERSION}" \
            --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
